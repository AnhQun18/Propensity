[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "new-propensity"
version = "0.1.0"
requires-python = ">=3.10"
description = "Dự án phân tích dữ liệu và mô hình propensity."
readme = "README.md"
dependencies = [
    "huggingface-hub>=1.0,<2.0",
    "kagglehub>=1.0,<2.0",
    "pandas>=2.2",
    "pyarrow>=21.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.scripts]
propensity-eda = "eda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["eda*"]

[project.optional-dependencies]
plots = ["matplotlib>=3.10"]
dev = ["build>=1.0"]
notebook = [
    "ipykernel>=6.0",
    "nbformat>=5.0",
    "nbclient>=0.10",
    "requests>=2.31",
    "tqdm>=4.66",
    "crcmod>=1.7",
    "ipywidgets>=8.0",
]
